<meta charset="utf-8">
<title>飲料店一樓 · 互動平面編輯器（共享）</title>
<style>
  :root{
    --bg:#e7ebec; --card:#f7f9f9; --ink:#232a2e; --sub:#5f6e70; --line:#c6d0ce; --line2:#dbe3e1;
    --accent:#2f7d72; --wall:#2b3236; --grid:#d8e0de; --sel:#e0632c;
    --cold:#cfe0e8; --coldB:#4a86a6; --water:#cfe6e2; --waterB:#2f8f8a; --heat:#f0dcc6; --heatB:#c47a3a;
    --seal:#e4ddf1; --sealB:#7a5fb0; --counter:#d3e3de; --counterB:#2f6f63; --shrine:#eee0c2; --shrineB:#a5842f;
    --shelf:#dee4e4; --shelfB:#6b7a7a; --shell:#e9ecec; --shellB:#8a9694;
    --mono:ui-monospace,"SF Mono",Menlo,monospace; --sans:ui-sans-serif,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0f1416; --card:#171d20; --ink:#e6ebe9; --sub:#93a3a3; --line:#33413f; --line2:#26302f;
    --accent:#5fb8a8; --wall:#c3ccca; --grid:#20292a; --sel:#e0854e;
    --cold:#22404e; --coldB:#6fb4d4; --water:#1f4340; --waterB:#54c2b8; --heat:#4a3524; --heatB:#e0995a;
    --seal:#332a49; --sealB:#a891d6; --counter:#1e3b37; --counterB:#5fb8a8; --shrine:#43371d; --shrineB:#d4b45e;
    --shelf:#2a3335; --shelfB:#8fa0a0; --shell:#1c2426; --shellB:#5c6a68;
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none}
  .app{display:flex;flex-direction:column;height:100vh}
  header{padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card);flex:none}
  .titl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;font-weight:650}
  .hint{font-size:11.5px;color:var(--sub);font-family:var(--mono)}
  .bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  button{font-family:var(--sans);font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:5px}
  button:hover{border-color:var(--accent)}
  button.p{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.warn{color:var(--sel);border-color:var(--sel)}
  .tgl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);cursor:pointer;user-select:none}
  .zoom{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--sub)}
  .zoom input{width:90px}
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;overflow:auto;padding:16px}
  .planwrap{position:relative;margin:0 auto}
  .plan{position:absolute;background:var(--card);border:3px solid var(--wall);box-shadow:0 2px 10px rgba(0,0,0,.12);box-sizing:content-box}
  .plan.measuring{cursor:crosshair}
  /* 面板（一格一層）：四層並排時目前那層有色框；樓層標籤掛在面板上緣外 */
  .plan.cur{box-shadow:0 0 0 3px var(--accent),0 2px 10px rgba(0,0,0,.12)}
  .plab{position:absolute;left:0;top:-22px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--sub);pointer-events:none;white-space:nowrap}
  .plan.cur .plab{color:var(--accent)}
  .grid{position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);}
  .fx{position:absolute;pointer-events:none;display:flex;align-items:center;justify-content:center;text-align:center;z-index:1;
    font-size:11px;color:var(--sub);font-family:var(--mono);border:1px dashed var(--shellB);background:var(--shell);border-radius:2px}
  .fx.stairs{background:repeating-linear-gradient(90deg,var(--shell),var(--shell) 5px,var(--shellB) 5px,var(--shellB) 5.6px)}
  .it{position:absolute;border:1.5px solid var(--counterB);background:var(--counter);border-radius:3px;cursor:grab;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;
    touch-action:none;user-select:none;padding:1px;line-height:1.05}
  .it:active{cursor:grabbing}
  .it .nm{font-weight:700;line-height:1.08;word-break:break-word}
  .it .dm{font-family:var(--mono);opacity:.85;line-height:1.05}
  .lblv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;overflow:hidden}
  .lblv>span{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;line-height:1.02}
  .it.sel{outline:2.5px solid var(--sel);outline-offset:1px;z-index:20}
  .it.bad{border-color:var(--sel)!important}
  .it.wallit{background:var(--wall)!important;border:1px solid var(--wall)!important;color:var(--card)}
  .it.door{background:transparent!important;border:none!important;overflow:visible;z-index:12}
  .it.door svg{width:100%;height:100%;overflow:visible}
  .it.win{background:transparent!important;border:none!important;overflow:visible;z-index:11}
  .it.win svg{width:100%;height:100%;overflow:visible}
  .gap{position:absolute;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--sel);color:var(--sel);
    font-family:var(--mono);font-size:10px;font-weight:700;line-height:1.3;padding:1px 4px;border-radius:6px;pointer-events:none;white-space:nowrap;z-index:8}
  .gapln{position:absolute;pointer-events:none;z-index:7}
  .panel{width:252px;flex:none;border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
  .app.nopanel .panel{display:none}
  @media(max-width:720px){main{flex-direction:column}.panel{width:auto;border-left:none;border-top:1px solid var(--line);max-height:36vh}}
  .sel-info{padding:12px;border-bottom:1px solid var(--line)}
  .sel-info h2{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin:0 0 8px}
  .kv{font-size:13px;margin:4px 0;font-family:var(--mono)}
  .kv b{font-family:var(--sans)}
  .kv input{width:60px;padding:2px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px}
  .rowbtn{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .rowbtn button{flex:1;justify-content:center;font-size:12px;padding:6px;min-width:64px}
  .list{flex:1;overflow:auto;padding:8px 10px}
  .list h2{font-size:11px;font-family:var(--mono);text-transform:uppercase;color:var(--sub);margin:6px 2px}
  .chip{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
  .chip:hover,.chip.on{background:var(--line2)}
  .sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.2);flex:none}
  .eye{border:none;background:transparent;padding:0 2px;font-size:13px;cursor:pointer;line-height:1;flex:none}
  .foot{font-size:11px;color:var(--sub);padding:6px 10px;border-top:1px solid var(--line);font-family:var(--mono)}
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px;max-width:360px;width:92%}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin:0 0 10px;font-size:15px}
  dialog label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
  dialog input,dialog textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px}
  dialog textarea{height:120px;resize:vertical}
  .dlgrow{display:flex;gap:8px}.dlgrow>*{flex:1}
  .svrow{display:flex;align-items:center;gap:8px}.svrow>span{flex:1;font-weight:600}.svrow button{padding:4px 9px;font-size:12px}
  /* ===== 同步狀態燈 ===== */
  .syncpill{font-size:12px;font-family:var(--mono);display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
  .syncpill.ok{color:var(--accent);border-color:var(--accent)}
  .syncpill.saving{color:var(--shrineB);border-color:var(--shrineB)}
  .syncpill.warn{color:var(--sel);border-color:var(--sel)}
  .syncpill.off{color:var(--sub)}
  /* ===== 方案列表 overlay ===== */
  .overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;overflow:auto}
  .overlay.hidden{display:none}
  .ovhead{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0}
  .ovhead h1{font-size:17px}
  .ovhead .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .ovbody{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .pcard{border:1px solid var(--line);background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .pcard .thumb{aspect-ratio:1300/375;background:#fff;border-bottom:1px solid var(--line2);display:block;width:100%;object-fit:contain}
  .pcard .pmeta{padding:9px 11px;display:flex;flex-direction:column;gap:2px}
  .pcard .pname{font-weight:700;font-size:14px;word-break:break-word}
  .pcard .ptime{font-size:11.5px;color:var(--sub);font-family:var(--mono)}
  .pcard .pacts{display:flex;gap:5px;padding:0 11px 11px;flex-wrap:wrap}
  .pcard .pacts button{flex:1;justify-content:center;font-size:12px;padding:5px;min-width:50px}
  .empty{grid-column:1/-1;color:var(--sub);text-align:center;padding:48px 12px;font-size:14px;line-height:1.7}
  /* 樓層 tab 與投影（別層疊上來的東西） */
  .ftabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .ftabs button{border:none;border-radius:0;padding:6px 12px;background:var(--card);color:var(--sub)}
  .ftabs button.on{background:var(--accent);color:#fff}
  .proj{position:absolute;pointer-events:none;z-index:2;border:1.5px dashed var(--sub);background:transparent;opacity:.55;
    display:flex;align-items:flex-start;justify-content:flex-start;font-size:10px;color:var(--sub);font-family:var(--mono);padding:2px 4px;box-sizing:border-box}
  .proj.shrine{border-color:var(--shrineB);color:var(--shrineB)}
  .proj.beam{background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(120,120,120,.18) 6px 8px)}
  .fx.beam{background:repeating-linear-gradient(45deg,var(--shell) 0 6px,rgba(80,80,80,.28) 6px 8px);z-index:3}
  /* 編輯結構模式：設備鎖住變淡、結構元件可選可拖 */
  .plan.structmode .it{pointer-events:none;opacity:.45}
  .plan.structmode .fx{pointer-events:auto;cursor:grab;z-index:11;outline:1.5px dashed var(--accent);outline-offset:-2px}
  .plan.structmode .fx.sel{outline:2.5px solid var(--sel);z-index:13}
  .proj.bad{border-color:var(--sel);color:var(--sel);opacity:.9;border-width:2.5px}
  .fx.bad{box-shadow:inset 0 0 0 3px var(--sel)}
  .it.shrinebad{box-shadow:0 0 0 3px var(--sel), 0 0 12px var(--sel)}
  .structbtn{display:none}.structon .structbtn{display:inline-flex}.structon .itembtn{display:none}
  #__toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--wall);color:var(--card);padding:9px 14px;border-radius:8px;font-size:13px;z-index:2000;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90%;opacity:0;transition:opacity .4s;pointer-events:none}
</style>

<!-- ===== 方案列表視圖 ===== -->
<div class="overlay" id="listOverlay">
  <div class="ovhead">
    <h1>飲料店平面 · 方案</h1>
    <span class="hint">大家共用，改完自動存、彼此幾秒內看到 · 把這個網址傳給家人就好</span>
    <div class="sp">
      <button class="p" id="newPlan">＋ 新增方案</button>
      <button id="importLocal">⬆ 從本機匯入</button>
    </div>
  </div>
  <div class="ovbody" id="planCards"></div>
</div>

<div class="app">
  <header>
    <div class="titl"><h1>飲料店 · 互動平面編輯器</h1>
      <span class="hint">1300×375cm · 四層同框 · 格線每50cm · 拖拉移動 · 點選可旋轉/複製/刪除/改尺寸</span></div>
    <div class="bar">
      <button id="backList">☰ 方案列表</button>
      <span class="syncpill off" id="syncPill">● 離線</span>
      <span class="ftabs" id="floorTabs"><button data-floor="1" class="on">1F</button><button data-floor="2">2F</button><button data-floor="3">3F</button><button data-floor="4">4F</button></span>
      <label class="tgl" title="直向：門口在下、樓梯在右，跟原始 CAD 同向"><input type="checkbox" id="orientToggle" checked> 直向</label>
      <label class="tgl" title="四層左到右並排；手機上小，關掉只看目前樓層"><input type="checkbox" id="allFloors"> 四層並排</label>
      <label class="tgl"><input type="checkbox" id="projToggle" checked> 投影別層</label>
      <label class="tgl" title="開著只能動梁／樓梯／廁所／玄關，設備鎖住；關著反過來"><input type="checkbox" id="structMode"> 🏗 編輯結構</label>
      <button class="structbtn" id="addBeam">＋ 梁</button>
      <button class="structbtn" id="addBath">＋ 廁所</button>
      <button class="structbtn" id="addStairs">＋ 樓梯</button>
      <button class="p itembtn" id="addDoor">＋ 門</button>
      <button class="itembtn" id="addWin">＋ 窗戶</button>
      <button class="itembtn" id="addWall">＋ 隔間牆</button>
      <button class="itembtn" id="addObj">＋ 自訂物件</button>
      <button id="dup">⧉ 複製</button>
      <button id="rot">⟳ 旋轉90°</button>
      <button id="flip">⇄ 翻面</button>
      <button class="warn" id="del">🗑 刪除</button>
      <label class="tgl"><input type="checkbox" id="snap" checked> 貼齊(緊貼歸零)</label>
      <label class="tgl"><input type="checkbox" id="gaps" checked> 顯示間距</label>
      <button id="togglePanel">◧ 隱藏清單</button>
      <button id="measure">📏 量距</button>
      <button id="clearM">清量距</button>
      <button class="p" id="share">🔗 分享網址</button>
      <button id="png">🖼 PNG</button>
      <button id="pdf">🖨 PDF</button>
      <button id="io">匯出/匯入</button>
      <button class="warn" id="reset">重設擺法</button>
      <span class="zoom">🔍 <input type="range" id="zoom" min="0.4" max="2.6" step="0.05" value="1"></span>
    </div>
  </header>
  <main>
    <div class="stage" id="stage"><div class="planwrap" id="planwrap"></div></div>
    <div class="panel">
      <div class="sel-info">
        <h2>目前選取</h2>
        <div id="selBody" class="kv" style="color:var(--sub)">點一個方塊來看尺寸／移動它</div>
        <div class="rowbtn" id="selBtns" style="display:none">
          <button id="rot2">⟳ 旋轉</button><button id="dup2">⧉ 複製</button><button id="hide2">🙈 隱藏</button><button class="warn" id="del2">刪除</button></div>
      </div>
      <div class="list" id="list"></div>
      <div class="foot" id="foot"></div>
    </div>
  </main>
</div>

<dialog id="objDlg"><h3>新增自訂物件</h3>
  <label>名稱</label><input id="oName" placeholder="例如：三槽水槽">
  <div class="dlgrow"><div><label>長(cm)</label><input id="oW" type="number" value="90"></div>
  <div><label>寬(cm)</label><input id="oD" type="number" value="60"></div></div>
  <div class="rowbtn"><button class="p" id="oOk">新增</button><button id="oCancel">取消</button></div>
</dialog>
<dialog id="svDlg"><h3>本機備份（存在這台瀏覽器）</h3>
  <div id="svList" style="display:flex;flex-direction:column;gap:8px;font-size:13px"></div>
  <div class="rowbtn" style="margin-top:12px"><button id="svClose">關閉</button></div>
</dialog>
<dialog id="ioDlg"><h3>匯出／匯入配置（進階備援）</h3>
  <label>複製這段給我，或貼上配置碼後按「匯入」</label>
  <textarea id="ioText"></textarea>
  <div class="rowbtn"><button class="p" id="ioCopy">複製</button><button id="ioImport">匯入</button><button id="ioClose">關閉</button></div>
</dialog>
<dialog id="newDlg"><h3>新增方案</h3>
  <label>方案名稱</label><input id="newName" placeholder="例如：方案A">
  <label>從哪裡開始？</label>
  <div class="rowbtn" id="newFrom">
    <button data-from="copy" class="p" id="newCopy">複製目前這份</button>
    <button data-from="default">預設擺法</button>
    <button data-from="blank">空白</button>
  </div>
  <div class="rowbtn" style="margin-top:10px"><button id="newCancel">取消</button></div>
</dialog>
<dialog id="histDlg"><h3>版本紀錄</h3>
  <div id="histList" style="display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:52vh;overflow:auto"></div>
  <div class="rowbtn" style="margin-top:12px"><button id="histClose">關閉</button></div>
</dialog>

<script type="module">
import { DEFAULT_STRUCTURE, shrineViolations } from './rules.js';
import { FLOORS, KIND_LABEL, cur as onFloor, elementsOn, projection, draggableSet, floorOf } from './floors.js';
import { toScreen, toScreenPoint, fromScreenDelta, toModelPoint, panelSize, visualRot } from './view.js';
const PLAN_W=1300, PLAN_H=375, SNAP=8, MARGIN=140, PANEL_GAP=120;
const CAT={counter:['var(--counter)','var(--counterB)'],cold:['var(--cold)','var(--coldB)'],water:['var(--water)','var(--waterB)'],
  heat:['var(--heat)','var(--heatB)'],seal:['var(--seal)','var(--sealB)'],shrine:['var(--shrine)','var(--shrineB)'],shelf:['var(--shelf)','var(--shelfB)']};
// 建築結構（梁／樓梯／廁所／玄關）：一棟房子一份，全部方案共用，從 /api/structure 讀。
// 讀不到（離線、還沒人存過）就用 rules.js 的預設 1F 三個殼。
let elements=DEFAULT_STRUCTURE.slice(), structRev=0;
// 目前看的樓層。只是這台瀏覽器的檢視狀態，不進方案。
let curFloor=1;
try{ const f=+localStorage.getItem('drinkshop_floor'); if(FLOORS.includes(f))curFloor=f; }catch(e){}
// 安靜切層：只換目前樓層、tab、面板色框，不重畫——拖曳開始時用（重畫會把正在拖的元素換掉）。
function setFloorQuiet(f){ if(f===curFloor)return; curFloor=f; mp=null;   // 量測的第一點不跨樓層
  try{localStorage.setItem('drinkshop_floor',String(f));}catch(e){}
  document.querySelectorAll('#floorTabs button').forEach(b=>b.classList.toggle('on',+b.dataset.floor===f));
  panels.forEach((p,pf)=>p.classList.toggle('cur',pf===f)); }
function setFloor(f){ const same=f===curFloor; curFloor=f; sel=null; selEl=null; mp=null;
  try{localStorage.setItem('drinkshop_floor',String(f));}catch(e){}
  document.querySelectorAll('#floorTabs button').forEach(b=>b.classList.toggle('on',+b.dataset.floor===f));
  if(!same && !view.all){ buildPanels(); fit(); return; }   // 單層檢視：換層＝換面板
  panels.forEach((p,pf)=>p.classList.toggle('cur',pf===f)); render(); }

// ===== 檢視（CONTEXT.md）：同一份方案怎麼擺到畫面上。只是這台瀏覽器的狀態，不進方案 =====
// orient 'v' 直向（門口在下、樓梯在右，跟原始 CAD 同向）| 'h' 橫向；all 四層並排 | 單層。
// 初始值：直向；四層並排照視窗寬（≥720px 才開，跟 .panel 的手機斷點同一個數字）。
let view={orient:'v',all:window.innerWidth>=720};
try{ const v=JSON.parse(localStorage.getItem('drinkshop_view')); if(v&&typeof v==='object'){ if(v.orient==='h'||v.orient==='v')view.orient=v.orient; if(typeof v.all==='boolean')view.all=v.all; } }catch(e){}
function saveView(){ try{localStorage.setItem('drinkshop_view',JSON.stringify(view));}catch(e){} }
const V=()=>({orient:view.orient,floors:viewFloors()});

// 送出中又改了：記 pending，這一筆送完再用最新的 elements 補送一次，最後一次改動不會丟。
async function pushStructure(){ if(structPushing){ structPending=true; return; } structPushing=true; structPending=false;
  try{ const r=await fetch('/api/structure',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({structure:{elements},baseRev:structRev})});
    if(r.status===409){ const o=await r.json(); elements=o.structure.elements; structRev=o.rev; structPending=false; toast('建築結構被別人同時改了，已載入最新版，請重做剛才的結構調整'); render(); }
    else if(r.ok){ const o=await r.json(); structRev=o.rev; }
    else { toast('結構儲存失敗（HTTP '+r.status+'）'); }
  }catch(e){ toast('結構儲存失敗：離線'); }
  structPushing=false;
  if(structPending) pushStructure(); }

// 畫布排版（cm）：直向面板左到右、橫向面板上到下；四層之間留 PANEL_GAP、外圍留 MARGIN。
function layoutCm(){ const ps=panelSize(V()), n=viewFloors().length, gap=n>1?PANEL_GAP:0;
  const across=isV();   // 直向：面板沿 x 排；橫向：沿 y 疊
  const W=across?n*ps.w+(n-1)*gap:ps.w, H=across?ps.h:n*ps.h+(n-1)*gap;
  return {ps,n,gap,across,W:W+2*MARGIN,H:H+2*MARGIN}; }
function fit(){ const zoom=parseFloat($('#zoom').value), L=layoutCm();
  const availW=stage.clientWidth-32, availH=stage.clientHeight-32;
  // 橫向單層維持原本的「寬度貼合」；其他檢視整張塞進視窗（太小用 zoom 拉）
  scale=(!isV()&&L.n===1)?(availW/PLAN_W)*zoom:Math.max(0.05,Math.min(availW/L.W,availH/L.H))*zoom;
  planwrap.style.width=(L.W*scale)+'px'; planwrap.style.height=(L.H*scale)+'px';
  viewFloors().forEach((f,i)=>{ const p=panelOf(f); if(!p)return;
    const left=MARGIN+(L.across?i*(L.ps.w+L.gap):0), top=MARGIN+(L.across?0:i*(L.ps.h+L.gap));
    p.style.left=(left*scale)+'px'; p.style.top=(top*scale)+'px'; p.style.width=(L.ps.w*scale)+'px'; p.style.height=(L.ps.h*scale)+'px';
    const g=p.querySelector('.grid'); if(g)g.style.backgroundSize=(50*scale)+'px '+(50*scale)+'px'; });
  render(); }

// 模型矩形 → 面板上的 px（走檢視轉換；標籤永遠水平）
function place(el,x,y,w,d){ const s=toScreen(V(),{x,y,w,d}); el.style.left=s.sx*scale+'px'; el.style.top=s.sy*scale+'px'; el.style.width=s.sw*scale+'px'; el.style.height=s.sh*scale+'px'; }
// 門／窗自己帶旋轉（CSS 繞中心轉）：框用模型尺寸、放在畫面框的中心，角度由 visualRot 補上檢視的 90°
function placeRot(el,it){ const s=toScreen(V(),it), cx=s.sx+s.sw/2, cy=s.sy+s.sh/2;
  el.style.left=(cx-it.w/2)*scale+'px'; el.style.top=(cy-it.d/2)*scale+'px'; el.style.width=it.w*scale+'px'; el.style.height=it.d*scale+'px'; }
function positionEl(el,it){ if(it.door||it.win) placeRot(el,it); else place(el,it.x,it.y,it.w,it.d); }
function skip(a){ return a.door; }
function overlaps(a){ if(a.door||a.wall||a.win||a.hidden)return false; return onFloor(items,floorOf(a)).some(b=>b!==a && !b.door && !b.wall && !b.win && !b.hidden && !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.d<=b.y||b.y+b.d<=a.y)); }
function clampPos(it,x,y){ if(it.door) return [x,y]; return [Math.max(0,Math.min(PLAN_W-it.w,x)),Math.max(0,Math.min(PLAN_H-it.d,y))]; }

function snapPos(it,nx,ny){ let sx=nx,sy=ny;
  if(Math.abs(nx)<SNAP)sx=0; if(Math.abs(nx+it.w-PLAN_W)<SNAP)sx=PLAN_W-it.w;
  if(Math.abs(ny)<SNAP)sy=0; if(Math.abs(ny+it.d-PLAN_H)<SNAP)sy=PLAN_H-it.d;
  onFloor(items,floorOf(it)).forEach(o=>{ if(o===it||o.door||o.win)return;
    const vOv=ny<o.y+o.d&&o.y<ny+it.d, hOv=nx<o.x+o.w&&o.x<nx+it.w;
    if(vOv){ if(Math.abs(nx+it.w-o.x)<SNAP)sx=o.x-it.w; else if(Math.abs(nx-(o.x+o.w))<SNAP)sx=o.x+o.w;
      if(Math.abs(nx-o.x)<SNAP)sx=o.x; else if(Math.abs(nx+it.w-(o.x+o.w))<SNAP)sx=o.x+o.w-it.w; }
    if(hOv){ if(Math.abs(ny+it.d-o.y)<SNAP)sy=o.y-it.d; else if(Math.abs(ny-(o.y+o.d))<SNAP)sy=o.y+o.d;
      if(Math.abs(ny-o.y)<SNAP)sy=o.y; else if(Math.abs(ny+it.d-(o.y+o.d))<SNAP)sy=o.y+o.d-it.d; } });
  return [Math.max(0,Math.min(PLAN_W-it.w,sx)),Math.max(0,Math.min(PLAN_H-it.d,sy))];
}

function renderGaps(){ panels.forEach(pn=>[...pn.querySelectorAll('.gap,.gapln')].forEach(e=>e.remove()));
  const g=$('#gaps'); if(!g||!g.checked) return;
  panels.forEach((pn,f)=>{ const here=onFloor(items,f);
  here.forEach(a=>{ if(a.door||a.win||a.hidden)return; let best=null,bg=1e9;
    here.forEach(b=>{ if(b===a||b.door||b.win||b.hidden)return; if(!(a.y<b.y+b.d&&b.y<a.y+a.d))return;
      const gg=b.x-(a.x+a.w); if(gg<-1)return; if(gg<bg){bg=gg;best=b;} });
    if(best&&bg>=1){ const y=(Math.max(a.y,best.y)+Math.min(a.y+a.d,best.y+best.d))/2; addGapLine(pn,a.x+a.w,y,best.x,y,bg); } });
  here.forEach(a=>{ if(a.door||a.win||a.hidden)return; let best=null,bg=1e9;
    here.forEach(b=>{ if(b===a||b.door||b.win||b.hidden)return; if(!(a.x<b.x+b.w&&b.x<a.x+a.w))return;
      const gg=b.y-(a.y+a.d); if(gg<-1)return; if(gg<bg){bg=gg;best=b;} });
    if(best&&bg>=1){ const x=(Math.max(a.x,best.x)+Math.min(a.x+a.w,best.x+best.w))/2; addGapLine(pn,x,a.y+a.d,x,best.y,bg); } });
  });
}
// 兩個模型點之間的間距線＋數字：線就是一個 w 或 d 為 0 的模型矩形，轉到畫面後看哪邊是 0 決定橫線／直線
function addGapLine(pn,x1,y1,x2,y2,v){ const s=toScreen(V(),{x:Math.min(x1,x2),y:Math.min(y1,y2),w:Math.abs(x2-x1),d:Math.abs(y2-y1)});
  const ln=document.createElement('div'); ln.className='gapln'; ln.style.left=s.sx*scale+'px'; ln.style.top=s.sy*scale+'px';
  if(s.sh<1e-6){ ln.style.width=s.sw*scale+'px'; ln.style.borderTop='1px dashed var(--sel)'; }
  else { ln.style.height=s.sh*scale+'px'; ln.style.borderLeft='1px dashed var(--sel)'; }
  pn.appendChild(ln);
  const lb=document.createElement('div'); lb.className='gap'; lb.textContent=Math.round(v); lb.style.left=(s.sx+s.sw/2)*scale+'px'; lb.style.top=(s.sy+s.sh/2)*scale+'px'; pn.appendChild(lb); }

let drag=null;
function startDrag(e){ if(measuring){ handleMeasureClick(e); return; } const el=e.currentTarget,id=+el.dataset.id,it=items.find(i=>i.id===id); if(!it)return;
  setFloorQuiet(floorOf(it));   // 四層並排：在哪個面板拖，那層就是目前樓層（不重畫，正在拖的元素要留著）
  sel=id; panels.forEach(pn=>pn.querySelectorAll('.it.sel').forEach(x=>x.classList.remove('sel'))); el.classList.add('sel');
  drag={it,el,sx:e.clientX,sy:e.clientY,ox:it.x,oy:it.y};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.addEventListener('pointermove',onDrag); el.addEventListener('pointerup',endDrag); el.addEventListener('pointercancel',endDrag);
  buildList(); updateSel(); e.preventDefault(); e.stopPropagation(); }
function onDrag(e){ if(!drag)return; const it=drag.it;
  const dm=fromScreenDelta(V(),(e.clientX-drag.sx)/scale,(e.clientY-drag.sy)/scale);   // 畫面位移 → 模型位移
  let nx=drag.ox+dm.dx, ny=drag.oy+dm.dy;
  if(it.door){ /* 門可超出圖面、不吸附 */ }
  else { [nx,ny]=clampPos(it,nx,ny); if($('#snap').checked)[nx,ny]=snapPos(it,nx,ny); }
  it.x=nx; it.y=ny; positionEl(drag.el,it);
  drag.el.classList.toggle('bad',overlaps(it)); renderGaps(); renderMeasures(); updateSel(); }
function endDrag(){ if(!drag)return; const el=drag.el;
  el.removeEventListener('pointermove',onDrag); el.removeEventListener('pointerup',endDrag); el.removeEventListener('pointercancel',endDrag);
  drag=null; save(); render(); }

// 結構元件的拖曳：不吸附（量出來的數字用面板打），只夾在圖框內
let dragEl=null;
function startDragEl(e){ if(measuring){ handleMeasureClick(e); return; } const el=e.currentTarget, s=elements.find(x=>x.id===el.dataset.eid); if(!s)return;
  setFloorQuiet(floorOf(s));
  selEl=s.id; sel=null; panels.forEach(pn=>pn.querySelectorAll('.fx.sel').forEach(x=>x.classList.remove('sel'))); el.classList.add('sel');
  dragEl={s,el,sx:e.clientX,sy:e.clientY,ox:s.x,oy:s.y};
  try{el.setPointerCapture(e.pointerId);}catch(_){}
  el.addEventListener('pointermove',onDragEl); el.addEventListener('pointerup',endDragEl); el.addEventListener('pointercancel',endDragEl);
  updateSel(); e.preventDefault(); e.stopPropagation(); }
function onDragEl(e){ if(!dragEl)return; const s=dragEl.s;
  const dm=fromScreenDelta(V(),(e.clientX-dragEl.sx)/scale,(e.clientY-dragEl.sy)/scale);
  const nx=Math.round(Math.max(0,Math.min(PLAN_W-s.w,dragEl.ox+dm.dx))), ny=Math.round(Math.max(0,Math.min(PLAN_H-s.d,dragEl.oy+dm.dy)));
  s.x=nx; s.y=ny; place(dragEl.el,s.x,s.y,s.w,s.d); updateSel(); }
function endDragEl(){ if(!dragEl)return; const el=dragEl.el;
  el.removeEventListener('pointermove',onDragEl); el.removeEventListener('pointerup',endDragEl); el.removeEventListener('pointercancel',endDragEl);
  dragEl=null; saveStructure(); render(); }
function updateSelEl(){ const s=elements.find(x=>x.id===selEl);
  if(!s){ $('#selBody').innerHTML='🏗 編輯結構中：點一個梁／樓梯／廁所／玄關來移動或改尺寸；設備已鎖住'; $('#selBody').style.color='var(--sub)'; $('#selBtns').style.display='none'; return; }
  $('#selBody').style.color='var(--ink)'; $('#selBtns').style.display='none';
  const num=(id,v)=>'<input id="'+id+'" type="number" step="1" value="'+Math.round(v)+'" style="width:64px">';
  $('#selBody').innerHTML='<div class="kv"><b>'+esc(KIND_LABEL[s.kind]||s.kind)+'</b> · '+curFloor+'F</div>'+
    '<div class="kv">名稱 <input id="en" value="'+esc(s.name||'')+'" style="width:150px"></div>'+
    '<div class="kv">X '+num('ex',s.x)+' Y '+num('ey',s.y)+'</div>'+
    '<div class="kv">長 '+num('ew',s.w)+' 寬 '+num('ed',s.d)+' cm</div>'+
    '<div class="rowbtn"><button class="warn" id="edel">刪除這個結構元件</button></div>'+
    '<div class="kv" style="color:var(--sub)">全部方案共用；改完自動存</div>';
  // 尺寸不能超過圖框（不然位置夾限會算出負範圍、拖不動）
  const bind=(id,k,min,max)=>{ const el=$('#'+id); if(!el)return; el.onchange=()=>{ const v=k==='name'?el.value.trim():Math.min(max,Math.max(min,+el.value||0)); s[k]=v;
    if(k!=='name'){ s.x=Math.max(0,Math.min(PLAN_W-s.w,s.x)); s.y=Math.max(0,Math.min(PLAN_H-s.d,s.y)); } saveStructure(); render(); }; };
  bind('en','name',0,0); bind('ex','x',0,PLAN_W); bind('ey','y',0,PLAN_H); bind('ew','w',5,PLAN_W); bind('ed','d',5,PLAN_H);
  const db=$('#edel'); if(db)db.onclick=delElement; }

function rotate(){ if(structMode||sel==null)return; const it=items.find(i=>i.id===sel); if(!it)return;
  const cx=it.x+it.w/2,cy=it.y+it.d/2; if(!it.door&&!it.win)[it.w,it.d]=[it.d,it.w]; it.rot=((it.rot||0)+90)%360;
  [it.x,it.y]=clampPos(it,cx-it.w/2,cy-it.d/2); save(); render(); }
function dup(){ if(structMode||sel==null)return; const it=items.find(i=>i.id===sel); if(!it)return;
  const c=JSON.parse(JSON.stringify(it)); c.id=uid++; [c.x,c.y]=clampPos(c,it.x+30,it.y+30); items.push(c); sel=c.id; save(); render(); }
function del(){ if(structMode){ delElement(); return; } if(sel==null)return; items=items.filter(i=>i.id!==sel); sel=null; save(); render(); }

function updateSel(){ if(structMode){ updateSelEl(); return; } const it=items.find(i=>i.id===sel);
  if(!it){$('#selBody').innerHTML='點一個方塊來看尺寸／移動它';$('#selBody').style.color='var(--sub)';$('#selBtns').style.display='none';return;}
  $('#selBody').style.color='var(--ink)';$('#selBtns').style.display='flex';
  if(it.door){ $('#selBody').innerHTML='<div class="kv"><b>門（四分之一圓）</b></div>'+
      '<div class="kv">門寬/半徑 <input id="dw" type="number" min="20" step="5" value="'+it.w+'"> cm</div>'+
      '<div class="rowbtn"><button id="dflip">翻面(換開向)</button></div>'+
      '<div class="kv" style="color:var(--sub)">⟳旋轉換牆邊·可拖到圖外(外開)</div>';
    const dw=$('#dw'); if(dw)dw.onchange=()=>{const v=Math.max(20,+dw.value||100); it.w=it.d=v; save(); render();};
    const df=$('#dflip'); if(df)df.onclick=()=>{it.flip=!it.flip; save(); render();}; return; }
  if(it.win){ $('#selBody').innerHTML='<div class="kv"><b>窗戶</b></div>'+
      '<div class="kv">窗寬 <input id="ww" type="number" min="20" step="5" value="'+it.w+'"> · 厚 <input id="wt2" type="number" min="4" step="1" value="'+it.d+'"> cm</div>'+
      '<div class="kv" style="color:var(--sub)">⟳旋轉貼直牆·拖到牆邊會吸附</div>';
    const ww=$('#ww'),wt2=$('#wt2'); if(ww)ww.onchange=()=>{it.w=Math.max(20,+ww.value||120);save();render();}; if(wt2)wt2.onchange=()=>{it.d=Math.max(4,+wt2.value||16);save();render();}; return; }
  if(it.wall){ $('#selBody').innerHTML='<div class="kv"><b>隔間牆</b></div>'+
      '<div class="kv">長 <input id="wl" type="number" min="10" step="5" value="'+it.w+'"> · 厚 <input id="wt" type="number" min="4" step="1" value="'+it.d+'"> cm</div>'+
      '<div class="kv">位置 X '+Math.round(it.x)+' · Y '+Math.round(it.y)+'</div>';
    const wl=$('#wl'),wt=$('#wt'); if(wl)wl.onchange=()=>{it.w=Math.max(10,+wl.value||10);save();render();}; if(wt)wt.onchange=()=>{it.d=Math.max(4,+wt.value||10);save();render();}; return; }
  $('#selBody').innerHTML='<div class="kv"><b>'+esc(it.n)+'</b></div>'+
    '<div class="kv">尺寸 '+it.w+' × '+it.d+(it.h?' × '+it.h:'')+' cm</div>'+
    '<div class="kv">位置 X '+Math.round(it.x)+' · Y '+Math.round(it.y)+'</div>'+
    '<div class="kv">距牆 後牆'+Math.round(it.x)+' 門口側'+Math.round(PLAN_W-it.x-it.w)+' 樓梯側'+Math.round(it.y)+' 對面牆'+Math.round(PLAN_H-it.y-it.d)+'</div>'+
    (overlaps(it)?'<div class="kv" style="color:var(--sel)">⚠ 和別件重疊</div>':'')+
    (violations().get(it.id)||[]).map(v=>'<div class="kv" style="color:var(--sel)">⛔ 神明桌'+ruleText(v)+'</div>').join(''); }
function buildList(){ const wrap=$('#list'); const here=cur(); const nh=here.filter(i=>i.hidden).length; wrap.innerHTML='<h2>'+curFloor+'F 清單 · 👁隱藏/顯示'+(nh?'（'+nh+'隱藏）':'')+'</h2>';
  here.forEach(it=>{ const cc=it.wall?['var(--wall)','var(--wall)']:(it.win?['var(--cold)','var(--coldB)']:(CAT[it.c]||CAT.shelf)); const c=document.createElement('div'); c.className='chip'+(sel===it.id?' on':''); if(it.hidden)c.style.opacity='.45';
    c.innerHTML='<span class="sw" style="background:'+cc[0]+';border-color:'+cc[1]+'"></span><span>'+(it.door?'門 '+it.w:(it.win?'窗 '+it.w:esc(it.n)))+
      '</span><span style="margin-left:auto;color:var(--sub);font-family:var(--mono);font-size:11px">'+it.w+'×'+it.d+'</span>';
    const eye=document.createElement('button'); eye.className='eye'; eye.textContent=it.hidden?'🙈':'👁'; eye.title=it.hidden?'顯示':'隱藏';
    // 結構模式：設備鎖住，清單只能看、不能藏／選（跟畫布上的 .it 一致）
    eye.onclick=(ev)=>{ ev.stopPropagation(); if(structMode)return; it.hidden=!it.hidden; if(it.hidden&&sel===it.id)sel=null; save(); render(); }; c.appendChild(eye);
    c.onclick=()=>{ if(structMode)return; it.hidden=false; sel=it.id; save(); render();
      const pn=panelOf(floorOf(it)), sr=toScreen(V(),it); if(pn) stage.scrollTo({left:pn.offsetLeft+sr.sx*scale-120,top:pn.offsetTop+sr.sy*scale-80,behavior:'smooth'}); }; wrap.appendChild(c); }); }

// 量距離工具（兩點直線，含斜角）
let measures=[], measuring=false, mp=null;
function loadM(){ try{measures=JSON.parse(localStorage.getItem('drinkshop_meas'))||[];}catch(e){measures=[];} }
function saveM(){ localStorage.setItem('drinkshop_meas',JSON.stringify(measures)); if(window.__syncDirty)window.__syncDirty(); }
function ptPos(p){ if(!p)return [0,0]; if(p.ref!=null){ const it=items.find(i=>i.id===p.ref); if(it) return [it.x+p.cx*it.w, it.y+p.cy*it.d]; } return [p.x||0,p.y||0]; }
// 面板上的 px（面板左上為原點）→ 吸附後的模型點：先轉成模型座標，再用模型 cm 比距離（門檻 18px 換算成 cm）
function snapPoint(clx,cly){ const m=toModelPoint(V(),clx/scale,cly/scale), TH=18/scale; let best=null,bd=TH;
  cur().forEach(it=>{ if(it.door||it.win||it.hidden)return; for(let cx=0;cx<=1;cx++)for(let cy=0;cy<=1;cy++){
    const gx=it.x+cx*it.w, gy=it.y+cy*it.d, dd=Math.hypot(gx-m.x,gy-m.y);
    if(dd<bd){bd=dd;best={ref:it.id,cx,cy,x:gx,y:gy};} } });
  curEls().forEach(s=>{ for(let cx=0;cx<=1;cx++)for(let cy=0;cy<=1;cy++){
    const gx=s.x+cx*s.w, gy=s.y+cy*s.d, dd=Math.hypot(gx-m.x,gy-m.y);
    if(dd<bd){bd=dd;best={x:gx,y:gy};} } });
  if(best) return best;
  let x=m.x, y=m.y;
  if(Math.abs(x)<20)x=0; if(Math.abs(x-PLAN_W)<20)x=PLAN_W;
  if(Math.abs(y)<20)y=0; if(Math.abs(y-PLAN_H)<20)y=PLAN_H;
  return {x:Math.round(x),y:Math.round(y)}; }
function handleMeasureClick(e){ e.stopPropagation(); e.preventDefault();
  const pn=e.target.closest('.plan'); if(!pn)return; const f=+pn.dataset.floor;
  if(f!==curFloor){ mp=null; setFloorQuiet(f); }   // 換面板＝換層，第一點作廢
  const r=pn.getBoundingClientRect();
  const pt=snapPoint(e.clientX-r.left, e.clientY-r.top);
  if(!mp){ mp=pt; renderMeasures(); } else { measures.push({id:uid++,a:mp,b:pt,floor:curFloor}); mp=null; saveM(); render(); } }
const curM=()=>onFloor(measures,curFloor);
function renderMeasures(){ panels.forEach((pn,f)=>{ const old=pn.querySelector('#measLayer'); if(old)old.remove(); [...pn.querySelectorAll('.measlb')].forEach(e=>e.remove());
  const NS='http://www.w3.org/2000/svg', svg=document.createElementNS(NS,'svg'); svg.id='measLayer';
  svg.setAttribute('style','position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:18;overflow:visible');
  const ac=cssv('--accent'); let html='';
  const S=(x,y)=>{ const p=toScreenPoint(V(),x,y); return [p.sx*scale,p.sy*scale]; };
  const here=onFloor(measures,f);
  here.forEach(m=>{ const [ax,ay]=m.a?ptPos(m.a):[m.x1,m.y1], [bx,by]=m.b?ptPos(m.b):[m.x2,m.y2]; const A=S(ax,ay), B=S(bx,by);
    html+='<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+B[0]+'" y2="'+B[1]+'" stroke="'+ac+'" stroke-width="1.5" stroke-dasharray="5 3"/>'+
      '<circle cx="'+A[0]+'" cy="'+A[1]+'" r="3.2" fill="'+ac+'"/><circle cx="'+B[0]+'" cy="'+B[1]+'" r="3.2" fill="'+ac+'"/>'; });
  if(mp&&f===curFloor){ const [px,py]=ptPos(mp); const P=S(px,py); html+='<circle cx="'+P[0]+'" cy="'+P[1]+'" r="4.5" fill="none" stroke="'+ac+'" stroke-width="2"/>'; }
  svg.innerHTML=html; pn.appendChild(svg);
  here.forEach(m=>{ const [ax,ay]=m.a?ptPos(m.a):[m.x1,m.y1], [bx,by]=m.b?ptPos(m.b):[m.x2,m.y2];
    const M=S((ax+bx)/2,(ay+by)/2), dist=Math.round(Math.hypot(bx-ax,by-ay));
    const lb=document.createElement('div'); lb.className='gap measlb'; lb.style.borderColor=ac; lb.style.color=ac; lb.style.zIndex='19';
    lb.style.left=M[0]+'px'; lb.style.top=M[1]+'px'; lb.style.pointerEvents='auto'; lb.style.cursor='pointer'; lb.title='點一下刪除這條'; lb.textContent=dist;
    lb.onclick=(ev)=>{ ev.stopPropagation(); measures=measures.filter(z=>z.id!==m.id); saveM(); render(); }; pn.appendChild(lb); }); }); }

// 進 innerHTML／屬性值前一律過這裡：名稱是任意字串、而且方案與結構都是大家共用的
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// 匯出跟著檢視：看到什麼匯什麼。面板排法同 layoutCm()，每層一個 <g data-floor>，座標全走 toScreen／toScreenPoint。
function buildSVG(){ const s=1.7, L=layoutCm(), floors=viewFloors();
  const ln=v=>(v*s).toFixed(1);
  const W=Math.round(L.W*s), H=Math.round(L.H*s);
  const ink=cssv('--wall'),sub=cssv('--sub'),line=cssv('--line'),acc=cssv('--accent'),shc=cssv('--shell'),sealB=cssv('--sealB'),coldB=cssv('--coldB');
  const P={counter:[cssv('--counter'),cssv('--counterB')],cold:[cssv('--cold'),cssv('--coldB')],water:[cssv('--water'),cssv('--waterB')],heat:[cssv('--heat'),cssv('--heatB')],seal:[cssv('--seal'),cssv('--sealB')],shrine:[cssv('--shrine'),cssv('--shrineB')],shelf:[cssv('--shelf'),cssv('--shelfB')]};
  let g='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect width="'+W+'" height="'+H+'" fill="#ffffff"/>';
  const ttl=floors.length>1?floors[0]+'F–'+floors[floors.length-1]+'F':curFloor+'F';
  g+='<text x="'+(W/2)+'" y="'+Math.round(22*s)+'" font-family="sans-serif" font-size="'+Math.round(11*s)+'" text-anchor="middle" fill="#111">飲料店 '+ttl+' 平面配置 · 1300×375cm</text>';
  floors.forEach((f,i)=>{
    const ox=MARGIN+(L.across?i*(L.ps.w+L.gap):0), oy=MARGIN+(L.across?0:i*(L.ps.h+L.gap));   // 面板左上（cm）
    const px=v=>(v*s).toFixed(1), R=r=>toScreen(V(),r), Pt=(x,y)=>toScreenPoint(V(),x,y);
    g+='<g data-floor="'+f+'" transform="translate('+ln(ox)+' '+ln(oy)+')">';
    g+='<text x="0" y="'+(-6*s).toFixed(1)+'" font-family="monospace" font-size="'+Math.round(10*s)+'" font-weight="700" fill="#111">'+f+'F</text>';
    g+='<rect x="0" y="0" width="'+ln(L.ps.w)+'" height="'+ln(L.ps.h)+'" fill="none" stroke="'+ink+'" stroke-width="3"/>';
    elementsOn(elements,f).forEach(o=>{ const r=R(o); g+='<rect x="'+px(r.sx)+'" y="'+px(r.sy)+'" width="'+ln(r.sw)+'" height="'+ln(r.sh)+'" fill="'+shc+'" stroke="'+line+'"/>'+
      '<text x="'+px(r.sx+r.sw/2)+'" y="'+px(r.sy+r.sh/2)+'" font-family="monospace" font-size="'+Math.round(9*s)+'" text-anchor="middle" dominant-baseline="middle" fill="'+sub+'">'+esc(elLabel(o))+'</text>'; });
    onFloor(items,f).forEach(it=>{ if(it.hidden)return; const r=R(it), cx=r.sx+r.sw/2, cy=r.sy+r.sh/2, cxp=px(cx), cyp=px(cy);
      if(it.door||it.win){ // 門窗：模型尺寸的框放在畫面框中心，繞中心轉 visualRot（跟畫面上的 placeRot 同一招）
        const bx=cx-it.w/2, by=cy-it.d/2; g+='<g transform="rotate('+visualRot(V(),it.rot)+' '+cxp+' '+cyp+')'+(it.door&&it.flip?' translate('+px(2*cx)+' 0) scale(-1 1)':'')+'">';
        if(it.door){ g+='<path d="M'+px(bx)+' '+px(by+it.d)+' A'+ln(it.w)+' '+ln(it.d)+' 0 0 1 '+px(bx+it.w)+' '+px(by)+'" fill="none" stroke="'+sealB+'" stroke-width="1.6"/>'+
            '<rect x="'+px(bx+it.w-6)+'" y="'+px(by)+'" width="'+ln(6)+'" height="'+ln(it.d)+'" fill="#fff" stroke="'+sealB+'" stroke-width="1.6"/>'; }
        else { g+='<rect x="'+px(bx)+'" y="'+px(by)+'" width="'+ln(it.w)+'" height="'+ln(it.d)+'" fill="#fff" stroke="'+coldB+'" stroke-width="1.6"/>'+
            '<line x1="'+px(bx)+'" y1="'+cyp+'" x2="'+px(bx+it.w)+'" y2="'+cyp+'" stroke="'+coldB+'" stroke-width="1.6"/>'; }
        g+='</g>';
      } else { const cc=it.wall?[cssv('--wall'),cssv('--wall')]:(P[it.c]||P.shelf), tc=it.wall?'#ffffff':'#1a1f22', pw=r.sw*s, pd=r.sh*s;
        g+='<rect x="'+px(r.sx)+'" y="'+px(r.sy)+'" width="'+ln(r.sw)+'" height="'+ln(r.sh)+'" fill="'+cc[0]+'" stroke="'+cc[1]+'" stroke-width="1.4"/>';
        const fs=Math.max(8,Math.min(pw*0.9/Math.max(2,[...it.n].length), pd*0.5, 22));
        g+='<text x="'+cxp+'" y="'+(parseFloat(cyp)-3).toFixed(1)+'" font-family="sans-serif" font-size="'+fs.toFixed(1)+'" font-weight="700" text-anchor="middle" fill="'+tc+'">'+esc(it.n)+'</text>'+
          '<text x="'+cxp+'" y="'+(parseFloat(cyp)+fs*0.95).toFixed(1)+'" font-family="monospace" font-size="'+(fs*0.68).toFixed(1)+'" text-anchor="middle" fill="'+tc+'">'+it.w+'×'+it.d+'</text>';
      } });
    onFloor(measures,f).forEach(m=>{ const A=m.a?ptPos(m.a):[m.x1,m.y1], B=m.b?ptPos(m.b):[m.x2,m.y2], a=Pt(A[0],A[1]), b=Pt(B[0],B[1]);
      g+='<line x1="'+px(a.sx)+'" y1="'+px(a.sy)+'" x2="'+px(b.sx)+'" y2="'+px(b.sy)+'" stroke="'+acc+'" stroke-width="1.5" stroke-dasharray="6 4"/>'+
        '<text x="'+px((a.sx+b.sx)/2)+'" y="'+px((a.sy+b.sy)/2)+'" font-family="monospace" font-size="'+Math.round(10*s)+'" font-weight="700" text-anchor="middle" fill="'+acc+'">'+Math.round(Math.hypot(B[0]-A[0],B[1]-A[1]))+'</text>'; });
    g+='</g>';
  });
  // 比例尺：整張圖的左下角
  g+='<rect x="'+ln(MARGIN)+'" y="'+ln(L.H-MARGIN+40)+'" width="'+ln(100)+'" height="5" fill="#111"/><text x="'+ln(MARGIN+50)+'" y="'+ln(L.H-MARGIN+34)+'" font-family="monospace" font-size="'+Math.round(9*s)+'" text-anchor="middle" fill="#555">1m(比例尺)</text>';
  g+='</svg>'; return g; }
function exportPNG(){ const svg=buildSVG(); const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}); const url=URL.createObjectURL(blob);
  const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=img.naturalWidth||img.width; c.height=img.naturalHeight||img.height;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0);
    c.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='飲料店平面圖.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); }); URL.revokeObjectURL(url); };
  img.onerror=()=>{ alert('產生PNG失敗，改用 PDF 試試'); URL.revokeObjectURL(url); }; img.src=url; }
function exportPDF(){ const svg=buildSVG(); const w=window.open('','_blank'); if(!w){alert('請允許彈出視窗後再按一次');return;}
  const L=layoutCm(), page=L.W>=L.H?'landscape':'portrait';   // 直向單層是直的紙、四層並排是橫的
  w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>飲料店平面圖</title><style>@page{size:'+page+';margin:6mm}html,body{margin:0}svg{width:100%;height:auto;display:block}</style></head><body>'+svg+'<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},300);}<\/scr'+'ipt></body></html>'); w.document.close(); }
$('#png').onclick=exportPNG; $('#pdf').onclick=exportPDF;

window.addEventListener('resize',fit);
loadM();
// 檢視開關：直向／橫向、四層並排／單層。四層並排時投影預設關（四層都看得到，不用疊）
$('#orientToggle').checked=isV(); $('#allFloors').checked=view.all; $('#projToggle').checked=!view.all;
$('#orientToggle').onchange=e=>setView({orient:e.target.checked?'v':'h'});
$('#allFloors').onchange=e=>{ $('#projToggle').checked=!e.target.checked; setView({all:e.target.checked}); };
buildPanels();
setFloor(curFloor);   // 同步 tab 樣式（上次看的樓層記在這台瀏覽器）

// ===== 建築結構：開機讀一次；讀不到就用預設殼 =====
async function loadStructure(){
  try{ const r=await fetch('/api/structure'); if(!r.ok)return; const o=await r.json();
    if(!Array.isArray(o.elements))return;
    // 本機已有未送出的結構改動（理論上載入完成前開不了結構模式，這是第二道保險）就不覆寫
    if(structDirty||structPushing||structPending)return;
    elements=o.elements; structRev=o.rev||0; structLoaded=true; render(); }
  catch(e){ /* 離線：留預設，結構模式開不了 */ }
}
loadStructure();

// ===== 伺服器同步層 + 方案列表控制器 =====
(function(){
  const API='/api/plans';
  let cur=null;          // 目前開啟的方案 {id,name}
  let curRev=0;
  let lastOpenedId=null;
  let dirtyTimer=null, pushing=false, dragging=false, applying=false, pollTimer=null;

  const pill=document.getElementById('syncPill');
  function setPill(cls,txt){ pill.className='syncpill '+cls; pill.textContent=txt; }

  // 給 save()/saveM() 呼叫的同步觸發
  window.__syncDirty=function(){
    if(!cur||applying) return;                 // 沒開方案、或程式載入時不觸發
    setPill('saving','儲存中…');
    clearTimeout(dirtyTimer);
    dirtyTimer=setTimeout(()=>{ dirtyTimer=null; pushPlan(); },800);
  };

  function planData(){ return {items:items, measures:measures}; }
  function applyPlan(p){
    applying=true;
    items=(p&&p.items)?JSON.parse(JSON.stringify(p.items)):[];
    measures=(p&&p.measures)?JSON.parse(JSON.stringify(p.measures)):[];
    uid=Math.max(0,...items.map(i=>i.id||0),...measures.map(m=>m.id||0))+1;
    sel=null; save(); saveM(); render();
    applying=false;
  }

  async function pushPlan(){
    if(!cur||pushing) return; pushing=true;
    try{
      const r=await fetch(API+'/'+cur.id,{method:'PUT',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({plan:planData(),baseRev:curRev})});
      if(r.status===409){ const o=await r.json();
        const msg=dragging?'有人同時修改，已載入最新版，請重做剛才的變更':'已載入最新版本';
        applyPlan(o.plan); curRev=o.rev; setPill('warn','⚠ 已更新'); toast(msg);
      } else if(r.ok){ const o=await r.json(); curRev=o.rev; setPill('ok','✓ 已同步'); }
      else { setPill('off','● 離線'); }
    }catch(e){ setPill('off','● 離線(用本機)'); }
    pushing=false;
  }
  async function pullPlan(){
    if(!cur||dragging||pushing||dirtyTimer) return;   // 有未存的本機編輯就先不拉，避免蓋掉
    try{ const r=await fetch(API+'/'+cur.id); if(!r.ok)return; const o=await r.json();
      if(o.rev>curRev){ applyPlan(o.plan); curRev=o.rev; setPill('warn','⚠ 已載入他人更新');
        setTimeout(()=>{ if(cur)setPill('ok','✓ 已同步'); },2600); }
    }catch(e){}
  }

  // 追蹤是否正在拖曳（避免同步時打斷）
  planwrap.addEventListener('pointerdown',()=>{dragging=true;},true);
  window.addEventListener('pointerup',()=>{dragging=false;},true);
  window.addEventListener('pointercancel',()=>{dragging=false;},true);

  // ---- 方案列表 ----
  const overlay=document.getElementById('listOverlay');
  function showList(){ stopPoll(); cur=null; setPill('off','● 未開啟'); overlay.classList.remove('hidden'); loadList(); }
  function hideList(){ overlay.classList.add('hidden'); }
  function timeAgo(ts){ if(!ts)return '—'; const s=(Date.now()/1000)-ts;
    if(s<60)return '剛剛'; if(s<3600)return Math.floor(s/60)+' 分鐘前'; if(s<86400)return Math.floor(s/3600)+' 小時前'; return Math.floor(s/86400)+' 天前'; }
  function btn(t,cls,fn){ const b=document.createElement('button'); b.textContent=t; if(cls)b.className=cls; b.onclick=fn; return b; }

  async function loadList(){
    const box=document.getElementById('planCards'); box.innerHTML='<div class="empty">載入中…</div>';
    let list=[];
    try{ const r=await fetch(API); list=await r.json(); }
    catch(e){ box.innerHTML='<div class="empty">連不到伺服器（Mac mini 可能關機了）</div>'; return; }
    if(!list.length){ box.innerHTML='<div class="empty">還沒有方案。<br>按〔＋ 新增方案〕開始，或〔⬆ 從本機匯入〕把這台瀏覽器的舊擺法搬上來。</div>'; return; }
    list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    box.innerHTML='';
    list.forEach(p=>{
      const card=document.createElement('div'); card.className='pcard';
      const img=document.createElement('img'); img.className='thumb'; img.alt=p.name; img.loading='lazy';
      img.src=API+'/'+p.id+'/thumb.svg?r='+(p.rev||0);
      const meta=document.createElement('div'); meta.className='pmeta';
      const nm=document.createElement('span'); nm.className='pname'; nm.textContent=p.name;
      const tm=document.createElement('span'); tm.className='ptime'; tm.textContent='最後修改：'+timeAgo(p.updatedAt);
      meta.append(nm,tm);
      const acts=document.createElement('div'); acts.className='pacts';
      acts.append(btn('開啟','p',()=>openPlan(p.id)), btn('改名','',()=>renamePlan(p)),
        btn('版本','',()=>showHistory(p)), btn('刪除','warn',()=>deletePlan(p)));
      card.append(img,meta,acts); box.appendChild(card);
    });
  }

  async function openPlan(id){
    try{ const r=await fetch(API+'/'+id); const o=await r.json();
      cur={id:o.id,name:o.name}; curRev=o.rev; lastOpenedId=id;
      applyPlan(o.plan); hideList(); fit(); setPill('ok','✓ 已同步'); startPoll();
    }catch(e){ alert('開啟失敗'); }
  }
  function startPoll(){ stopPoll(); pollTimer=setInterval(pullPlan,4000); }
  function stopPoll(){ if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }

  async function createPlan(name,plan){
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,plan:plan})});
    const o=await r.json(); return o.id;
  }
  async function renamePlan(p){ const n=prompt('新名稱：',p.name); if(!n||n===p.name)return;
    await fetch(API+'/'+p.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})}); loadList(); }
  async function deletePlan(p){ if(!confirm('確定刪除「'+p.name+'」？\n（會移到伺服器回收區，可請 Andre 復原）'))return;
    await fetch(API+'/'+p.id,{method:'DELETE'}); loadList(); }

  async function showHistory(p){
    const dlg=document.getElementById('histDlg'), list=document.getElementById('histList');
    list.innerHTML='載入中…'; dlg.showModal();
    let hs=[]; try{ hs=await (await fetch(API+'/'+p.id+'/history')).json(); }catch(e){}
    if(!hs.length){ list.innerHTML='<div style="color:var(--sub)">尚無版本紀錄</div>'; return; }
    list.innerHTML='';
    hs.forEach(h=>{ const row=document.createElement('div'); row.className='svrow';
      const sp=document.createElement('span'); sp.textContent='版本 '+h.rev+' · '+new Date(h.ts*1000).toLocaleString('zh-TW');
      row.append(sp, btn('回復到這版','p',async()=>{
        if(!confirm('回復到版本 '+h.rev+'？\n（目前內容會先自動存成新版本，可再回復回來）'))return;
        await fetch(API+'/'+p.id+'/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev:h.rev})});
        dlg.close(); if(cur&&cur.id===p.id){ openPlan(p.id); } else { loadList(); }
      }));
      list.appendChild(row); });
  }
  document.getElementById('histClose').onclick=()=>document.getElementById('histDlg').close();

  // 新增方案（三選一）
  const newDlg=document.getElementById('newDlg');
  document.getElementById('newPlan').onclick=()=>{
    document.getElementById('newName').value='';
    // 只有在有「上一次開過的方案」時才顯示「複製目前這份」
    document.getElementById('newCopy').style.display=(cur||lastOpenedId)?'':'none';
    newDlg.showModal();
  };
  document.getElementById('newCancel').onclick=()=>newDlg.close();
  document.getElementById('newFrom').onclick=async(e)=>{
    const b=e.target.closest('button'); if(!b||!b.dataset.from)return;
    const from=b.dataset.from;
    const name=(document.getElementById('newName').value.trim())||'新方案';
    let plan={items:[],measures:[]};
    if(from==='default'){ plan={items:DEFAULT.map((o,i)=>({...o,id:i+1,rot:0,door:false})),measures:[]}; }
    else if(from==='copy'){
      if(cur){ plan=JSON.parse(JSON.stringify(planData())); }
      else if(lastOpenedId){ try{ const o=await (await fetch(API+'/'+lastOpenedId)).json(); plan=o.plan; }catch(_){} }
    }
    newDlg.close();
    try{ const id=await createPlan(name,plan); openPlan(id); }catch(_){ alert('新增失敗'); }
  };

  // 從本機匯入
  document.getElementById('importLocal').onclick=async()=>{
    if(!confirm('把「這台瀏覽器」的目前擺法與所有本機備份，匯入成伺服器上的方案？\n（只需在你有資料的這台做一次）'))return;
    let n=0;
    try{ const ci=JSON.parse(localStorage.getItem('drinkshop_v1')||'null');
      const cm=JSON.parse(localStorage.getItem('drinkshop_meas')||'[]');
      if(ci&&ci.length){ await createPlan('目前擺法',{items:ci,measures:cm||[]}); n++; }
    }catch(e){}
    try{ const sv=JSON.parse(localStorage.getItem('drinkshop_saves')||'{}');
      for(const nm of Object.keys(sv)){ const dd=sv[nm];
        const plan=Array.isArray(dd)?{items:dd,measures:[]}:{items:dd.items||[],measures:dd.measures||[]};
        await createPlan(nm,plan); n++; }
    }catch(e){}
    alert('已匯入 '+n+' 份方案。');
    loadList();
  };

  document.getElementById('backList').onclick=()=>{ stopPoll(); showList(); };

  // 開機：顯示方案列表
  showList();
})();
</script>
